version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: nuget
    directory: /windows
    schedule:
      interval: weekly

  - package-ecosystem: bun
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        patterns:
          - "*"
        update-types:
          - major
          - minor
          - patch
